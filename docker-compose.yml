# Sobe tudo: Chatwoot (painel), Evolution (WhatsApp), Postgres, Redis e o bot.
# Portas publicadas só em 127.0.0.1: nada fica aberto para a rede.
# Versões fixadas em 2026-11; confira as releases antes de atualizar.

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.16.2
  environment: &chatwoot-env
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    FRONTEND_URL: http://localhost:3000
    POSTGRES_HOST: postgres
    POSTGRES_USERNAME: postgres
    POSTGRES_DATABASE: chatwoot
    REDIS_URL: redis://redis:6379/0
    ENABLE_ACCOUNT_SIGNUP: "false"
    # O bot e a Evolution moram na rede interna do Docker; sem isto o Chatwoot recusa os webhooks
    # ("has no public ip addresses"). Seguro aqui: instalação de uma conta só, sem cadastro aberto.
    SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    ACTIVE_STORAGE_SERVICE: local
  volumes:
    - chatwoot_storage:/app/storage
    - ./marca:/app/public/marca:ro # logo, ícone e tema RevGás (scripts/aplicar-marca.rb)
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    restart: unless-stopped

  chatwoot-migrar:
    <<: *chatwoot
    command: bundle exec rails db:chatwoot_prepare
    restart: "no"

  chatwoot:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      chatwoot-migrar: { condition: service_completed_successfully }

  # Configura o painel a cada `docker compose up` (sem rodar nada à mão): etiquetas, respostas
  # prontas, atributos, horário e aba "Pedido RevGás" (scripts/chatwoot-config.ts, pela API).
  # Antes da primeira instalação (sem CHATWOOT_ADMIN_TOKEN ou sem npm run setup) só avisa e sai.
  chatwoot-config:
    build: .
    image: revgas-atende-bot
    command: ["npx", "tsx", "scripts/chatwoot-config.ts"]
    env_file: .env
    environment:
      CHATWOOT_CONFIG_URL: http://chatwoot:3000
      CHATWOOT_CONFIG_AUTOMATICO: "1"
    depends_on:
      chatwoot: { condition: service_started }
    restart: "no"

  # Marca RevGás, menu "Pedidos de hoje" e cache do painel (scripts/chatwoot-ajustes.rb). Grava
  # direto no banco do Chatwoot: não precisa de token nem do Chatwoot no ar, e não depende do
  # chatwoot-config (um erro lá, como um token errado, não deixa o painel sem marca e sem menu).
  chatwoot-ajustes:
    <<: *chatwoot
    command: bundle exec rails runner /revgas/chatwoot-ajustes.rb
    environment:
      <<: *chatwoot-env
      PAINEL_TOKEN: ${PAINEL_TOKEN:-}
      PAINEL_URL: ${PAINEL_URL:-}
    volumes:
      - ./scripts:/revgas:ro
    depends_on:
      chatwoot-migrar: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: "no"

  chatwoot-sidekiq:
    <<: *chatwoot
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      chatwoot-migrar: { condition: service_completed_successfully }

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      CHATWOOT_ENABLED: "true"
      CHATWOOT_MESSAGE_READ: "true"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  bot:
    build: .
    image: revgas-atende-bot
    env_file: .env
    environment:
      CHATWOOT_URL: http://chatwoot:3000
      REDIS_URL: redis://redis:6379/2
      PORTA: "3000"
    ports:
      # Painel "Pedido RevGás" (aba na conversa e lista "Pedidos de hoje" do menu do Chatwoot).
      # Só no 127.0.0.1: os dados do pedido
      # são pessoais e não podem ficar abertos na rede. A API do painel ainda exige PAINEL_TOKEN.
      - "127.0.0.1:3001:3000"
    volumes:
      - ./dados:/app/dados
    depends_on: [redis, chatwoot]
    restart: unless-stopped

volumes:
  postgres:
  redis:
  chatwoot_storage:
  evolution_instances:
