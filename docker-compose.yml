# Sobe tudo: Chatwoot (painel), WAHA (WhatsApp), Postgres, Redis e o bot.
# Portas publicadas só em 127.0.0.1: nada fica aberto para a rede.
# Versões fixadas em 2026-11; confira as releases antes de atualizar.

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.16.2
  environment: &chatwoot-env
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    FRONTEND_URL: http://localhost:3000
    POSTGRES_HOST: postgres
    POSTGRES_USERNAME: postgres
    POSTGRES_DATABASE: chatwoot
    REDIS_URL: redis://redis:6379/0
    ENABLE_ACCOUNT_SIGNUP: "false"
    # O bot e o WAHA moram na rede interna do Docker; sem isto o Chatwoot recusa os webhooks
    # ("has no public ip addresses"). Seguro aqui: instalação de uma conta só, sem cadastro aberto.
    SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    ACTIVE_STORAGE_SERVICE: local
  volumes:
    - chatwoot_storage:/app/storage
    - ./marca:/app/public/marca:ro # logo, ícone e tema RevGás (scripts/aplicar-marca.rb)
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    restart: unless-stopped

  chatwoot-migrar:
    <<: *chatwoot
    command: bundle exec rails db:chatwoot_prepare
    restart: "no"

  chatwoot:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      chatwoot-migrar: { condition: service_completed_successfully }

  # Configura o painel a cada `docker compose up` (sem rodar nada à mão): etiquetas, respostas
  # prontas, atributos, horário e aba "Pedido RevGás" (scripts/chatwoot-config.ts, pela API).
  # Antes da primeira instalação (sem CHATWOOT_ADMIN_TOKEN ou sem npm run setup) só avisa e sai.
  chatwoot-config:
    build: .
    image: revgas-atende-bot
    command: ["npx", "tsx", "scripts/chatwoot-config.ts"]
    # Só o que o script usa (não o .env inteiro): menor privilégio para um container de configuração.
    environment:
      CHATWOOT_CONFIG_URL: http://chatwoot:3000
      CHATWOOT_CONFIG_AUTOMATICO: "1"
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_ADMIN_TOKEN: ${CHATWOOT_ADMIN_TOKEN:-}
      PAINEL_TOKEN: ${PAINEL_TOKEN:-}
      PAINEL_URL: ${PAINEL_URL:-}
    depends_on:
      chatwoot: { condition: service_started }
    restart: "no"

  # Marca RevGás, menu "Pedidos de hoje" e cache do painel (scripts/chatwoot-ajustes.rb). Grava
  # direto no banco do Chatwoot (não precisa de token). Roda depois do chatwoot-config para renovar
  # o cache só depois de as etiquetas existirem; o chatwoot-config sai com 0 mesmo quando dá erro
  # (ex.: token errado, explicado no log), então essa espera não derruba a subida.
  chatwoot-ajustes:
    <<: *chatwoot
    command: bundle exec rails runner /revgas/chatwoot-ajustes.rb
    environment:
      <<: *chatwoot-env
      PAINEL_TOKEN: ${PAINEL_TOKEN:-}
      PAINEL_URL: ${PAINEL_URL:-}
    volumes:
      - ./scripts:/revgas:ro
    depends_on:
      chatwoot-migrar: { condition: service_completed_successfully }
      chatwoot-config: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: "no"

  chatwoot-sidekiq:
    <<: *chatwoot
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      chatwoot-migrar: { condition: service_completed_successfully }

  # Ponte WhatsApp ↔ Chatwoot: WAHA Core (grátis, sem licença), motor GOWS (sem navegador, lida
  # com remetentes @lid). Trocou a Evolution API, que travava ou não entregava mensagens (issue #15).
  # A integração com o Chatwoot (app "chatwoot") é criada pelo npm run setup.
  waha:
    image: devlikeapro/waha:gows-2026.10.1
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      # Sem chave ou senha, o WAHA subiria sem proteção: o compose recusa subir.
      WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY no .env}
      WAHA_API_KEY_PLAIN: ${WAHA_API_KEY:?defina WAHA_API_KEY no .env} # a integração com o Chatwoot exige a chave em texto puro
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-revgas}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?defina WAHA_DASHBOARD_PASSWORD no .env}
      WAHA_APPS_ENABLED: "True"
      WAHA_APPS_ON: chatwoot
      REDIS_URL: redis://redis:6379/7 # a integração com o Chatwoot usa filas no Redis
      WAHA_PUBLIC_URL: http://waha:3000
      WAHA_PRINT_QR: "False"
    volumes:
      # Sessão do WhatsApp (o chip conectado). Dá acesso às conversas do número: nunca vai para o git.
      - waha_sessoes:/app/.sessions
    ports:
      - "127.0.0.1:3002:3000" # painel do WAHA (QR code): http://127.0.0.1:3002/dashboard
    depends_on:
      redis: { condition: service_started }
    restart: unless-stopped

  # Banco "revgas" (chamadas à API e eventos, sem dados pessoais) e os papéis revgas_bot e
  # metabase_leitura. Idempotente: roda a cada subida e sai (scripts/revgas-db.sql).
  revgas-db:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SENHA_BOT: ${REVGAS_DB_SENHA:?defina REVGAS_DB_SENHA no .env}
      SENHA_METABASE: ${METABASE_DB_SENHA:?defina METABASE_DB_SENHA no .env}
    command: ["sh", "-c", 'psql -h postgres -U postgres -d postgres -q -v senha_bot="$$SENHA_BOT" -v senha_metabase="$$SENHA_METABASE" -f /revgas/revgas-db.sql']
    volumes:
      - ./scripts:/revgas:ro
    depends_on:
      postgres: { condition: service_healthy }
      chatwoot-migrar: { condition: service_completed_successfully } # o banco "chatwoot" já existe
    restart: "no"

  bot:
    build: .
    image: revgas-atende-bot
    env_file: .env
    environment:
      CHATWOOT_URL: http://chatwoot:3000
      REDIS_URL: redis://redis:6379/2
      PORTA: "3000"
      # Só INSERT/SELECT no banco revgas (sem acesso ao banco do Chatwoot).
      DATABASE_URL: postgres://revgas_bot:${REVGAS_DB_SENHA}@postgres:5432/revgas
    ports:
      # Painel "Pedido RevGás" (aba na conversa e lista "Pedidos de hoje" do menu do Chatwoot).
      # Só no 127.0.0.1: os dados do pedido
      # são pessoais e não podem ficar abertos na rede. A API do painel ainda exige PAINEL_TOKEN.
      - "127.0.0.1:3001:3000"
    volumes:
      - ./dados:/app/dados
    depends_on:
      redis: { condition: service_started }
      chatwoot: { condition: service_started }
      revgas-db: { condition: service_completed_successfully }
    restart: unless-stopped

  # Painel de análise "Integração RevGás" (Metabase): lê as tabelas revgas.chamadas_api e
  # revgas.eventos com o usuário metabase_leitura, que só enxerga o schema revgas (nada do Chatwoot).
  # A configuração do Metabase (conta, conexão e painéis) fica no volume metabase_dados; o SQL de cada
  # gráfico está versionado em docs/metabase.md. Só em 127.0.0.1: http://127.0.0.1:3003
  metabase:
    image: metabase/metabase:v0.65.6.3
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_LOCALE: pt_BR
      MB_ANON_TRACKING_ENABLED: "false"
      # Java com teto de memória: o Docker deste projeto costuma ter só ~4 GB para tudo.
      # Com 768 MB, a v0.65 ficou lenta a ponto de estourar o tempo de conexão (24/11).
      JAVA_OPTS: "-Xmx1g"
      # Em computador com pouca RAM livre, o teste de conexão passa dos 10 s padrão.
      MB_DB_CONNECTION_TIMEOUT_MS: "30000"
    volumes:
      - metabase_dados:/metabase-data
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      postgres: { condition: service_healthy }
      revgas-db: { condition: service_completed_successfully } # cria o usuário metabase_leitura
    restart: unless-stopped

volumes:
  postgres:
  redis:
  chatwoot_storage:
  waha_sessoes:
  metabase_dados:
