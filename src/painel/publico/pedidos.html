<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Pedidos de hoje · RevGás</title>
    <link rel="stylesheet" href="/painel/painel.css">
  </head>
  <body>
    <main class="central">
      <header class="barra">
        <div>
          <h1>Pedidos do WhatsApp</h1>
          <p id="resumo" class="sutil"></p>
        </div>
        <div class="controles">
          <label for="dia" class="sutil">Dia</label>
          <select id="dia"></select>
          <button id="atualizar" type="button">Atualizar</button>
        </div>
      </header>

      <dl id="numeros" class="numeros" aria-label="Números do dia" hidden></dl>

      <section id="secao-estoque" class="estoque">
        <h2>Estoque no ERP</h2>
        <ul id="estoque"></ul>
        <p id="erro-estoque" class="erro" hidden></p>
      </section>

      <div class="filtros">
        <div role="group" aria-label="Mostrar">
          <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
          <button type="button" data-filtro="abertas" aria-pressed="false">Em aberto</button>
          <button type="button" data-filtro="canceladas" aria-pressed="false">Canceladas</button>
        </div>
        <input id="busca" type="search" placeholder="Buscar cliente ou nº da venda" aria-label="Buscar cliente ou número da venda">
      </div>

      <p id="aviso" role="status">Carregando…</p>
      <ol id="lista" class="comandas"></ol>

      <template id="modelo">
        <li class="comanda">
          <div class="canhoto">
            <strong class="hora"></strong>
            <span class="ha"></span>
          </div>
          <div class="corpo">
            <div class="topo">
              <span class="numero"></span>
              <span class="selo"></span>
              <strong class="valor"></strong>
            </div>
            <p class="cliente"></p>
            <p class="itens"></p>
            <p class="endereco sutil"></p>
            <ol class="timeline" hidden></ol>
            <div class="acoes">
              <button type="button" class="link abrir">Abrir conversa</button>
              <button type="button" class="link ver-historico">Ver histórico</button>
              <button type="button" class="contorno-perigo cancelar" hidden>Cancelar venda</button>
            </div>
            <p class="resultado sutil" role="status"></p>
          </div>
        </li>
      </template>
    </main>
    <script src="/painel/status.js"></script>
    <script src="/painel/pedidos.js"></script>
  </body>
</html>
